<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>纺织生产端管理系统 - 入仓记录</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #e9f0f5; font-family: 'Segoe UI', 'SimSun', sans-serif; padding: 16px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 28px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .header { background: white; padding: 14px 20px; border-bottom: 1px solid #e2e9f0; }
        .header h1 { font-size: 1.3rem; color: #1f6e8c; }
        .header p { font-size: 0.7rem; color: #5e7e97; }

        .summary-cards { display: flex; gap: 15px; flex-wrap: wrap; padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #e2edf5; }
        .summary-card { background: white; padding: 12px 24px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); flex: 1; min-width: 120px; text-align: center; }
        .summary-card .num { font-size: 28px; font-weight: bold; color: #1f6e8c; }
        .summary-card .label { font-size: 12px; color: #888; margin-top: 4px; }
        .summary-card.in .num { color: #2e7d32; }
        .summary-card.out .num { color: #c62828; }
        .summary-card.stock .num { color: #1f6e8c; }
        .summary-card.pending .num { color: #e65100; }

        .tab-bar { display: flex; border-bottom: 2px solid #e2edf5; overflow-x: auto; background: white; }
        .tab { padding: 12px 20px; cursor: pointer; font-weight: 600; color: #5e7e97; border-bottom: 3px solid transparent; white-space: nowrap; }
        .tab.active { color: #1f6e8c; border-bottom-color: #1f6e8c; }

        .sub-tab-bar { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #e2edf5; padding-bottom: 8px; flex-wrap: wrap; }
        .sub-tab { padding: 6px 16px; cursor: pointer; font-weight: 600; color: #5e7e97; border-radius: 20px; font-size: 0.85rem; }
        .sub-tab.active { background: #1f6e8c; color: white; }

        .main-content { padding: 20px; }
        .panel { display: none; }
        .panel.active { display: block; }

        .pending-summary {
            background: #fff3e0;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            border-left: 4px solid #ff9800;
        }
        .pending-summary-item { font-size: 14px; }
        .pending-summary-item strong { color: #e65100; }

        .batch-bar { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

        .btn { background: #1f6e8c; color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-success { background: #2e7d32; }
        .btn-danger { background: #c62828; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-warning { background: #e65100; }
        .btn-outline { background: transparent; color: #666; border: 1px solid #ccc; }
        .btn-outline:hover { background: #f5f5f5; }
        .select-all-btn { background: #1565c0; color: white; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .select-all-btn:hover { background: #0d47a1; }
        .select-all-btn.grey { background: #78909c; }
        .select-all-btn.grey:hover { background: #546e7a; }

        .table-wrapper { overflow-x: auto; margin-top: 15px; border: 1px solid #e2edf5; border-radius: 12px; max-height: 520px; overflow-y: auto; }
        .table-wrapper thead { position: sticky; top: 0; z-index: 10; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th, .data-table td { border: 1px solid #e2edf5; padding: 8px 6px; text-align: left; }
        .data-table th { background: #eef3fc; white-space: nowrap; position: sticky; top: 0; z-index: 10; }
        .data-table td { word-break: break-word; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .modal-box {
            background: white; padding: 30px 35px; border-radius: 16px;
            max-width: 750px; width: 95%; max-height: 90vh;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }
        .modal-box h3 { margin-bottom: 12px; color: #1f6e8c; }
        .modal-box p { font-size: 15px; color: #333; margin-bottom: 16px; }
        .modal-box .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
        .modal-box .btn-row button { padding: 10px 28px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .modal-table-wrap { max-height: 400px; overflow-y: auto; border: 1px solid #e2edf5; border-radius: 8px; }
        .modal-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .modal-table th, .modal-table td { border: 1px solid #e2edf5; padding: 8px 10px; text-align: left; }
        .modal-table th { background: #eef3fc; position: sticky; top: 0; z-index: 5; }
        .modal-table .total-row { background: #e8f0fe; font-weight: bold; }

        .toast-msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; z-index: 2000; animation: fadeOut 2.5s ease; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }

        .status-badge {
            display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
        }
        .status-pending { background: #fff3e0; color: #e65100; }
        .status-in { background: #e8f5e9; color: #2e7d32; }
        .status-out { background: #fce4ec; color: #c62828; }

        .empty-row td { text-align: center; color: #999; padding: 30px 0; }

        @media (max-width: 600px) {
            .summary-cards { gap: 8px; padding: 10px; }
            .summary-card { padding: 8px 12px; min-width: 70px; }
            .summary-card .num { font-size: 20px; }
            .main-content { padding: 12px; }
            .tab { padding: 8px 12px; font-size: 13px; }
            .modal-box { padding: 20px; }
        }
        input { autocomplete: off; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
    const SUPABASE_URL = 'https://tdhbzdnaieqcqzmbctlx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkaGJ6ZG5haWVxY3F6bWJjdGx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTY4NDEsImV4cCI6MjA5Njc5Mjg0MX0.QSYPR37gOWNJkGIOEMwKsSa6mPkSFa5bXU_JSfxLWSM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentTab = 'in';          // print | scan | stock | in | out
    let currentSubTab = 'pending';  // pending | all

    function showToast(msg) {
        let div = document.createElement('div');
        div.className = 'toast-msg';
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2500);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function generateTagId() {
        let now = new Date();
        let ts = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') +
                 String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') + String(now.getSeconds()).padStart(2,'0');
        let random = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
        return 'TAG' + ts + random;
    }

    // ===== 更新库存 =====
    async function updateStock(spec, color, batch, deltaQty, deltaNet) {
        const { data: stock } = await supabase.from('stock_records')
            .select('*')
            .eq('spec', spec)
            .eq('color_no', color || '')
            .eq('batch_no', batch || '');
        
        if (stock && stock.length > 0) {
            const newQty = (stock[0].quantity || 0) + deltaQty;
            const newNet = (stock[0].net_weight || 0) + deltaNet;
            if (newQty <= 0 && newNet <= 0) {
                await supabase.from('stock_records').delete().eq('id', stock[0].id);
            } else {
                await supabase.from('stock_records').update({ quantity: newQty, net_weight: newNet }).eq('id', stock[0].id);
            }
        } else if (deltaQty > 0 || deltaNet > 0) {
            await supabase.from('stock_records').insert({ spec, color_no: color || '', batch_no: batch || '', quantity: Math.max(0, deltaQty), net_weight: Math.max(0, deltaNet) });
        }
    }

    // ===== 加载汇总 =====
    async function loadSummary() {
        try {
            const today = new Date().toISOString().slice(0,10);
            const { data: inData } = await supabase.from('in_records').select('*').gte('created_at', today);
            const inCount = inData ? inData.length : 0;
            const { data: outData } = await supabase.from('out_records').select('*').gte('created_at', today);
            const outCount = outData ? outData.length : 0;
            const { data: stockData } = await supabase.from('stock_records').select('*');
            let stockQty = 0;
            if (stockData) for (let s of stockData) stockQty += (s.quantity || 0);
            const { data: pendingData } = await supabase.from('tag_records').select('*').eq('status', '待出库');
            const pendingCount = pendingData ? pendingData.length : 0;
            document.getElementById('summaryIn').textContent = inCount;
            document.getElementById('summaryOut').textContent = outCount;
            document.getElementById('summaryStock').textContent = stockQty;
            document.getElementById('summaryPending').textContent = pendingCount;
        } catch(e) {}
    }

    // ===== 加载待入仓列表 =====
    async function loadPendingInList() {
        const { data } = await supabase.from('tag_records')
            .select('*')
            .eq('status', '待入仓')
            .order('created_at', { ascending: false });
        
        const tbody = document.getElementById('pendingInTableBody');
        const summaryDiv = document.getElementById('pendingInSummary');
        
        // 汇总：按规格+批号分组
        const summaryMap = new Map();
        for (let item of (data || [])) {
            const key = item.spec + '|' + (item.batch || '');
            if (!summaryMap.has(key)) {
                summaryMap.set(key, { spec: item.spec, batch: item.batch || '-', qty: 0, net: 0 });
            }
            let sum = summaryMap.get(key);
            sum.qty += item.qty;
            sum.net += item.net;
        }
        const summaryArray = Array.from(summaryMap.values());
        if (summaryDiv) {
            if (summaryArray.length === 0) {
                summaryDiv.innerHTML = '<span style="color:#999;">暂无待入仓产品</span>';
            } else {
                summaryDiv.innerHTML = summaryArray.map(s => 
                    '<div class="pending-summary-item">📦 <strong>' + escapeHtml(s.spec) + '</strong> 批号: ' + escapeHtml(s.batch) + ' 共 <strong>' + s.qty + '</strong> 个 净重 <strong>' + s.net.toFixed(2) + '</strong> kg</div>'
                ).join('');
            }
        }

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="14">暂无待入仓记录</td></tr>';
            document.getElementById('pendingInCount').textContent = '0';
            return;
        }
        document.getElementById('pendingInCount').textContent = data.length;
        tbody.innerHTML = data.map(item => `
            <tr>
                <td><input type="checkbox" class="pending-in-cb" data-id="${escapeHtml(item.tag_id)}"></td>
                <td><span class="status-badge status-pending">待入仓</span></td>
                <td>${escapeHtml(item.spec)}</td>
                <td>${escapeHtml(item.color || '-')}</td>
                <td>${escapeHtml(item.machine || '-')}</td>
                <td>${(item.gross || 0).toFixed(2)}kg</td>
                <td>${item.qty}</td>
                <td>${(item.tong || 0).toFixed(2)}kg</td>
                <td>${(item.box || 0).toFixed(2)}kg</td>
                <td>${(item.net || 0).toFixed(2)}kg</td>
                <td>${escapeHtml(item.batch || '-')}</td>
                <td>${item.created_at ? new Date(item.created_at).toLocaleString() : '-'}</td>
                <td>${escapeHtml(item.tag_id)}</td>
                <td><button class="btn btn-sm btn-danger" onclick="window.deletePendingIn('${escapeHtml(item.tag_id)}')">删除</button></td>
            </tr>
        `).join('');
    }

    // ===== 删除待入仓记录 =====
    window.deletePendingIn = async function(tagId) {
        if (!confirm('确定删除此待入仓记录吗？')) return;
        await supabase.from('tag_records').delete().eq('tag_id', tagId);
        showToast('✅ 已删除');
        loadPendingInList();
        loadSummary();
    };

    // ===== 确认入仓 =====
    window.confirmIn = async function() {
        const cbs = document.querySelectorAll('.pending-in-cb:checked');
        if (cbs.length === 0) { showToast('请勾选要入仓的记录'); return; }
        if (!confirm('确认入仓 ' + cbs.length + ' 个产品吗？')) return;

        let success = 0;
        for (const cb of cbs) {
            const tagId = cb.getAttribute('data-id');
            const { data: tag } = await supabase.from('tag_records').select('*').eq('tag_id', tagId).single();
            if (tag && tag.status === '待入仓') {
                // 更新状态为已入仓
                await supabase.from('tag_records').update({ 
                    status: '已入仓', 
                    in_time: new Date().toISOString() 
                }).eq('tag_id', tagId);
                // 更新库存
                await updateStock(tag.spec, tag.color, tag.batch, tag.qty, tag.net);
                // 插入入仓记录
                await supabase.from('in_records').insert({
                    unique_id: tagId,
                    spec: tag.spec,
                    color_no: tag.color,
                    machine_no: tag.machine,
                    quantity: tag.qty,
                    gross_weight: tag.gross,
                    tube_weight: tag.tong,
                    box_weight: tag.box,
                    net_weight: tag.net,
                    batch_no: tag.batch,
                    in_date: new Date().toLocaleString()
                });
                success++;
            }
        }
        showToast('✅ 入仓完成！成功: ' + success);
        loadPendingInList();
        loadAllRecords();
        loadSummary();
    };

    // ===== 加载全部记录（已入仓 + 已出库） =====
    async function loadAllRecords() {
        const { data } = await supabase.from('tag_records')
            .select('*')
            .in('status', ['已入仓', '已出库'])
            .order('created_at', { ascending: false });
        
        const tbody = document.getElementById('allRecordsTableBody');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="14">暂无记录</td></tr>';
            document.getElementById('allRecordsCount').textContent = '0';
            return;
        }
        document.getElementById('allRecordsCount').textContent = data.length;
        tbody.innerHTML = data.map(item => {
            const statusLabel = item.status === '已入仓' ? '已入仓' : '已出库';
            const statusClass = item.status === '已入仓' ? 'status-in' : 'status-out';
            return `
                <tr>
                    <td><input type="checkbox" class="all-records-cb" data-id="${escapeHtml(item.tag_id)}"></td>
                    <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                    <td>${escapeHtml(item.spec)}</td>
                    <td>${escapeHtml(item.color || '-')}</td>
                    <td>${escapeHtml(item.machine || '-')}</td>
                    <td>${(item.gross || 0).toFixed(2)}kg</td>
                    <td>${item.qty}</td>
                    <td>${(item.tong || 0).toFixed(2)}kg</td>
                    <td>${(item.box || 0).toFixed(2)}kg</td>
                    <td>${(item.net || 0).toFixed(2)}kg</td>
                    <td>${escapeHtml(item.batch || '-')}</td>
                    <td>${item.created_at ? new Date(item.created_at).toLocaleString() : '-'}</td>
                    <td>${escapeHtml(item.tag_id)}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="window.deleteAllRecord('${escapeHtml(item.tag_id)}')">删除</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // ===== 删除全部记录中的条目（已入仓或已出库） =====
    window.deleteAllRecord = async function(tagId) {
        if (!confirm('确定删除此记录吗？将同步回滚库存！')) return;
        const { data: tag } = await supabase.from('tag_records').select('*').eq('tag_id', tagId).single();
        if (!tag) { showToast('记录不存在'); return; }
        // 如果是已入仓，回滚库存
        if (tag.status === '已入仓') {
            await updateStock(tag.spec, tag.color, tag.batch, -tag.qty, -tag.net);
            await supabase.from('in_records').delete().eq('unique_id', tagId);
        }
        // 如果是已出库，回滚库存（出库时已扣减，删除时加回来）
        if (tag.status === '已出库') {
            await updateStock(tag.spec, tag.color, tag.batch, tag.qty, tag.net);
            await supabase.from('out_records').delete().eq('unique_id', tagId);
        }
        await supabase.from('tag_records').delete().eq('tag_id', tagId);
        showToast('✅ 已删除并回滚库存');
        loadAllRecords();
        loadSummary();
    };

    // ===== 批量删除全部记录 =====
    window.batchDeleteAllRecords = async function() {
        const cbs = document.querySelectorAll('.all-records-cb:checked');
        if (cbs.length === 0) { showToast('请勾选要删除的记录'); return; }
        if (!confirm('确定批量删除 ' + cbs.length + ' 条记录吗？将同步回滚库存！')) return;
        let success = 0;
        for (const cb of cbs) {
            const tagId = cb.getAttribute('data-id');
            const { data: tag } = await supabase.from('tag_records').select('*').eq('tag_id', tagId).single();
            if (tag) {
                if (tag.status === '已入仓') {
                    await updateStock(tag.spec, tag.color, tag.batch, -tag.qty, -tag.net);
                    await supabase.from('in_records').delete().eq('unique_id', tagId);
                }
                if (tag.status === '已出库') {
                    await updateStock(tag.spec, tag.color, tag.batch, tag.qty, tag.net);
                    await supabase.from('out_records').delete().eq('unique_id', tagId);
                }
                await supabase.from('tag_records').delete().eq('tag_id', tagId);
                success++;
            }
        }
        showToast('✅ 批量删除完成！成功: ' + success);
        loadAllRecords();
        loadSummary();
    };

    // ===== 查看汇总弹窗 =====
    function showSummaryModal(records, title) {
        if (!records || records.length === 0) {
            showToast('没有选中的记录');
            return;
        }

        // 按规格+批号分组
        const groups = {};
        records.forEach(r => {
            const key = r.spec + '|' + (r.batch || '');
            if (!groups[key]) {
                groups[key] = { spec: r.spec, batch: r.batch || '-', gross: 0, qty: 0, net: 0, count: 0 };
            }
            groups[key].gross += (r.gross || 0);
            groups[key].qty += (r.qty || 0);
            groups[key].net += (r.net || 0);
            groups[key].count += 1;
        });

        const groupArray = Object.values(groups);
        let totalGross = 0, totalQty = 0, totalNet = 0, totalCount = 0;
        let rows = groupArray.map(g => {
            totalGross += g.gross;
            totalQty += g.qty;
            totalNet += g.net;
            totalCount += g.count;
            return `
                <tr>
                    <td>${escapeHtml(g.spec)}</td>
                    <td>${escapeHtml(g.batch)}</td>
                    <td style="text-align:right;">${g.gross.toFixed(2)}</td>
                    <td style="text-align:center;">${g.qty}</td>
                    <td style="text-align:right;">${g.net.toFixed(2)}</td>
                    <td style="text-align:center;">${g.count}</td>
                </tr>
            `;
        }).join('');

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal-box">
                <h3>📊 ${title}</h3>
                <p>已选 <strong>${records.length}</strong> 条记录，共 <strong>${groupArray.length}</strong> 个规格</p>
                <div class="modal-table-wrap">
                    <table class="modal-table">
                        <thead>
                            <tr>
                                <th>规格</th>
                                <th>批号</th>
                                <th style="text-align:right;">总毛重kg</th>
                                <th style="text-align:center;">总数量</th>
                                <th style="text-align:right;">总净重kg</th>
                                <th style="text-align:center;">件数</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                            <tr class="total-row">
                                <td colspan="2" style="text-align:right;">合计</td>
                                <td style="text-align:right;">${totalGross.toFixed(2)}</td>
                                <td style="text-align:center;">${totalQty}</td>
                                <td style="text-align:right;">${totalNet.toFixed(2)}</td>
                                <td style="text-align:center;">${totalCount}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="btn-row">
                    <button class="btn-outline" onclick="this.closest('.modal-overlay').remove()">关闭</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    // ===== 待入仓查看汇总 =====
    window.viewPendingInSummary = function() {
        const cbs = document.querySelectorAll('.pending-in-cb:checked');
        if (cbs.length === 0) { showToast('请勾选记录'); return; }
        const records = [];
        cbs.forEach(cb => {
            const tr = cb.closest('tr');
            const tds = tr.querySelectorAll('td');
            records.push({
                spec: tds[2]?.textContent || '',
                batch: tds[10]?.textContent || '',
                gross: parseFloat(tds[5]?.textContent) || 0,
                qty: parseInt(tds[6]?.textContent) || 0,
                net: parseFloat(tds[9]?.textContent) || 0
            });
        });
        showSummaryModal(records, '待入仓汇总');
    };

    // ===== 全部记录查看汇总 =====
    window.viewAllRecordsSummary = function() {
        const cbs = document.querySelectorAll('.all-records-cb:checked');
        if (cbs.length === 0) { showToast('请勾选记录'); return; }
        const records = [];
        cbs.forEach(cb => {
            const tr = cb.closest('tr');
            const tds = tr.querySelectorAll('td');
            records.push({
                spec: tds[2]?.textContent || '',
                batch: tds[10]?.textContent || '',
                gross: parseFloat(tds[5]?.textContent) || 0,
                qty: parseInt(tds[6]?.textContent) || 0,
                net: parseFloat(tds[9]?.textContent) || 0
            });
        });
        showSummaryModal(records, '已选记录汇总');
    };

    // ===== 全选/取消全选 =====
    window.toggleAll = function(selector, checked) {
        document.querySelectorAll(selector).forEach(cb => cb.checked = checked);
    };

    // ===== 渲染 =====
    function render() {
        document.getElementById('app').innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>🏭 纺织生产端管理系统</h1>
                    <p>打印标签 | 扫码出库 | 库存管理 | 入仓记录 | 出仓记录</p>
                </div>
                <div class="summary-cards">
                    <div class="summary-card in"><div class="num" id="summaryIn">0</div><div class="label">📥 今日入库</div></div>
                    <div class="summary-card out"><div class="num" id="summaryOut">0</div><div class="label">📤 今日出库</div></div>
                    <div class="summary-card stock"><div class="num" id="summaryStock">0</div><div class="label">📦 当前库存</div></div>
                    <div class="summary-card pending"><div class="num" id="summaryPending">0</div><div class="label">⏳ 待出库</div></div>
                </div>
                <div class="tab-bar">
                    <div class="tab ${currentTab === 'print' ? 'active' : ''}" data-tab="print">🖨️ 打印标签</div>
                    <div class="tab ${currentTab === 'scan' ? 'active' : ''}" data-tab="scan">📷 扫码出库</div>
                    <div class="tab ${currentTab === 'stock' ? 'active' : ''}" data-tab="stock">📦 库存管理</div>
                    <div class="tab ${currentTab === 'in' ? 'active' : ''}" data-tab="in">📋 入仓记录</div>
                    <div class="tab ${currentTab === 'out' ? 'active' : ''}" data-tab="out">📤 出仓记录</div>
                </div>
                <div class="main-content">
                    <!-- ===== 入仓记录面板 ===== -->
                    <div id="inPanel" class="panel ${currentTab === 'in' ? 'active' : ''}">
                        <div class="sub-tab-bar">
                            <div class="sub-tab ${currentSubTab === 'pending' ? 'active' : ''}" data-subtab="pending">⏳ 待入仓 <span id="pendingInCount" style="background:#e65100;color:white;border-radius:50%;padding:0 8px;font-size:12px;">0</span></div>
                            <div class="sub-tab ${currentSubTab === 'all' ? 'active' : ''}" data-subtab="all">📋 全部记录 <span id="allRecordsCount" style="background:#1f6e8c;color:white;border-radius:50%;padding:0 8px;font-size:12px;">0</span></div>
                        </div>

                        <!-- 待入仓 -->
                        <div id="pendingInPanel" style="display: ${currentSubTab === 'pending' ? 'block' : 'none'};">
                            <div id="pendingInSummary" class="pending-summary">加载中...</div>
                            <div class="batch-bar">
                                <div class="flex-row">
                                    <button class="btn btn-success" onclick="window.confirmIn()">✅ 确认入仓</button>
                                    <button class="select-all-btn" onclick="window.toggleAll('.pending-in-cb', true)">全选</button>
                                    <button class="select-all-btn grey" onclick="window.toggleAll('.pending-in-cb', false)">取消全选</button>
                                    <button class="btn btn-outline" onclick="window.viewPendingInSummary()">📊 查看汇总</button>
                                </div>
                            </div>
                            <div class="table-wrapper">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th style="width:30px"><input type="checkbox" id="selectAllPendingIn" onchange="window.toggleAll('.pending-in-cb', this.checked)"></th>
                                            <th>状态</th>
                                            <th>规格</th>
                                            <th>色号</th>
                                            <th>机号</th>
                                            <th>毛重</th>
                                            <th>数量</th>
                                            <th>筒重</th>
                                            <th>箱重</th>
                                            <th>净重</th>
                                            <th>批号</th>
                                            <th>日期</th>
                                            <th>标签ID</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="pendingInTableBody"></tbody>
                                </table>
                            </div>
                        </div>

                        <!-- 全部记录 -->
                        <div id="allRecordsPanel" style="display: ${currentSubTab === 'all' ? 'block' : 'none'};">
                            <div class="batch-bar">
                                <div class="flex-row">
                                    <button class="btn btn-danger" onclick="window.batchDeleteAllRecords()">🗑️ 批量删除</button>
                                    <button class="select-all-btn" onclick="window.toggleAll('.all-records-cb', true)">全选</button>
                                    <button class="select-all-btn grey" onclick="window.toggleAll('.all-records-cb', false)">取消全选</button>
                                    <button class="btn btn-outline" onclick="window.viewAllRecordsSummary()">📊 查看汇总</button>
                                </div>
                            </div>
                            <div class="table-wrapper">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th style="width:30px"><input type="checkbox" id="selectAllRecords" onchange="window.toggleAll('.all-records-cb', this.checked)"></th>
                                            <th>状态</th>
                                            <th>规格</th>
                                            <th>色号</th>
                                            <th>机号</th>
                                            <th>毛重</th>
                                            <th>数量</th>
                                            <th>筒重</th>
                                            <th>箱重</th>
                                            <th>净重</th>
                                            <th>批号</th>
                                            <th>日期</th>
                                            <th>标签ID</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="allRecordsTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 其他面板占位 -->
                    <div id="printPanel" class="panel ${currentTab === 'print' ? 'active' : ''}"><p style="color:#999;padding:40px;text-align:center;">打印标签面板（已隐藏，请使用入仓记录管理）</p></div>
                    <div id="scanPanel" class="panel ${currentTab === 'scan' ? 'active' : ''}"><p style="color:#999;padding:40px;text-align:center;">扫码出库面板（已隐藏）</p></div>
                    <div id="stockPanel" class="panel ${currentTab === 'stock' ? 'active' : ''}"><p style="color:#999;padding:40px;text-align:center;">库存管理面板（已隐藏）</p></div>
                    <div id="outPanel" class="panel ${currentTab === 'out' ? 'active' : ''}"><p style="color:#999;padding:40px;text-align:center;">出仓记录面板（已隐藏）</p></div>
                </div>
            </div>
        `;

        // 绑定Tab切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentTab = tab.dataset.tab;
                currentSubTab = 'pending';
                render();
            });
        });

        document.querySelectorAll('.sub-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentSubTab = tab.dataset.subtab;
                render();
                if (currentSubTab === 'pending') {
                    loadPendingInList();
                } else {
                    loadAllRecords();
                }
            });
        });

        // 加载数据
        loadSummary();
        if (currentSubTab === 'pending') {
            loadPendingInList();
        } else {
            loadAllRecords();
        }
    }

    render();
})();
</script>
</body>
</html>
